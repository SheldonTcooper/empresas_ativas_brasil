# ═══════════════════════════════════════════════════════════════════════════
# Nginx — EmpresasAtivasBR
# Coloque em: /etc/nginx/sites-available/empresasativasbr
# Ative: ln -s /etc/nginx/sites-available/empresasativasbr /etc/nginx/sites-enabled/
# SSL:  certbot --nginx -d empresasativasbr.com.br -d www.empresasativasbr.com.br
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name empresasativasbr.com.br www.empresasativasbr.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name empresasativasbr.com.br www.empresasativasbr.com.br;

    # Certbot preenche estas linhas automaticamente
    # ssl_certificate     /etc/letsencrypt/live/empresasativasbr.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/empresasativasbr.com.br/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/empresas_ativas_brasil;
    index index.html;

    # ── Frontend estático ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Assets JS/CSS com cache longo
    location ~* \.(js|css|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API → Node.js na porta 3001 ─────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header 'Access-Control-Allow-Origin'  $http_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # ── n8n (se rodar na mesma VPS, porta 5678) ───────────────────────
    # Para expor n8n em subdomínio separado, crie outro server block.
    # Descomentar abaixo para acessar em /n8n/:
    # location /n8n/ {
    #     proxy_pass         http://127.0.0.1:5678/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade    $http_upgrade;
    #     proxy_set_header   Connection "upgrade";
    #     proxy_set_header   Host       $host;
    # }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;
}
