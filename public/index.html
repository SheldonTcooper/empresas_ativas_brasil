<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmpresasAtivasBR — Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
<style>
:root{
  --bg:#0a0e27; --bg2:#0f1429; --panel:#111834; --panel2:#151d3f;
  --border:#232c52; --border2:#2a3560;
  --text:#e8ebf7; --muted:#8b93b8; --muted2:#5f6890;
  --blue1:#93C5FD; --blue2:#60A5FA; --blue3:#3B82F6; --blue4:#1E3A8A;
  --accent:#3b82f6; --accent2:#60a5fa;
  --green:#22c55e; --orange:#f97316; --purple:#a855f7;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
.app{display:flex;flex-direction:column;height:100vh;}

.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;z-index:50;}
.logo{font-size:19px;font-weight:800;color:#fff;display:flex;align-items:center;gap:2px;}
.logo .ativas{color:var(--accent2);}
.badge-br{background:var(--panel2);border:1px solid var(--border2);color:var(--muted);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:8px;}
.spacer{flex:1;}
.counter{background:var(--panel2);border:1px solid var(--border2);color:var(--accent2);font-weight:700;font-size:13px;padding:6px 14px;border-radius:8px;}

.toolbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 24px;display:none;align-items:center;gap:10px;flex-wrap:wrap;}
.toolbar.active{display:flex;}
.search-input{background:var(--panel);border:1px solid var(--border2);color:var(--text);padding:9px 14px;border-radius:8px;font-size:13px;width:260px;}
.tbtn{background:var(--panel);border:1px solid var(--border2);color:var(--text);padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
.tbtn.green{background:var(--green);border-color:var(--green);color:#04220f;}

.content{flex:1;position:relative;overflow:hidden;}
.view{position:absolute;inset:0;display:none;}
.view.active{display:block;}

#map, #map-estado{width:100%;height:100%;background:var(--bg);}
.leaflet-container{background:var(--bg)!important;}
.map-legend{position:absolute;bottom:20px;left:20px;background:rgba(17,24,52,0.95);border:1px solid var(--border2);padding:14px 16px;border-radius:10px;z-index:400;}
.map-legend h4{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);margin-bottom:5px;}
.legend-swatch{width:22px;height:13px;border-radius:3px;}
.map-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:12.5px;z-index:400;background:rgba(17,24,52,0.85);padding:6px 16px;border-radius:20px;border:1px solid var(--border);}

.side-panel{position:absolute;top:0;right:0;bottom:0;width:400px;background:var(--bg2);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .35s ease;z-index:500;display:flex;flex-direction:column;}
.side-panel.open{transform:translateX(0);}
.side-header{padding:20px 22px;border-bottom:1px solid var(--border);}
.side-header h2{font-size:19px;font-weight:800;color:#fff;}
.side-body{flex:1;overflow-y:auto;padding:18px 22px;}
.side-search{width:100%;background:var(--panel);border:1px solid var(--border2);color:var(--text);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;}
.side-list{display:flex;flex-direction:column;gap:6px;}
.side-item{background:var(--panel);border:1px solid var(--border);padding:12px 14px;border-radius:8px;cursor:pointer;transition:.2s;}
.side-item:hover{background:var(--panel2);border-color:var(--accent);}
.side-item .t{font-weight:600;font-size:13.5px;color:var(--text);}
.close-panel{position:absolute;top:18px;right:18px;background:var(--panel);border:1px solid var(--border2);color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;}

.back-btn{position:absolute;top:18px;left:18px;z-index:450;background:var(--panel);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}

.table-view{background:var(--bg);height:100%;overflow-y:auto;padding:18px 24px;}
table{width:100%;border-collapse:collapse;font-size:12px;background:var(--bg2);border-radius:10px;border:1px solid var(--border);}
thead th{background:var(--panel2);color:var(--muted);text-transform:uppercase;font-size:10.5px;font-weight:700;padding:12px 10px;text-align:left;border-bottom:1px solid var(--border2);}
tbody td{padding:11px 10px;border-bottom:1px solid var(--border);color:var(--text);}
tbody tr:hover{background:var(--panel);}
.cnpj{font-family:monospace;color:var(--muted);font-size:11px;}
.razao{font-weight:600;color:#fff;}
.badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;}
.b-matriz{background:rgba(34,197,94,0.15);color:#4ade80;}
.email{color:var(--accent2);font-size:11.5px;}

::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">Empresas<span class="ativas">Ativas</span>BR</div>
    <span class="badge-br">BR Brasil</span>
    <div class="spacer"></div>
    <div class="counter" id="counter-total">45.148.920 empresas ativas</div>
  </div>

  <div class="toolbar" id="toolbar">
    <input class="search-input" id="filtro-empresas" placeholder="🔍 Filtrar empresas...">
    <button class="tbtn" onclick="voltarParaCNAEs()">← Mudar CNAE</button>
    <button class="tbtn" onclick="resetar()">🏠 Início</button>
    <button class="tbtn green" onclick="exportarCSV()">⬇ Exportar CSV</button>
  </div>

  <div class="content">
    <div class="view active" id="view-map">
      <div id="map"></div>
      <div class="map-legend">
        <h4>Empresas ativas</h4>
        <div class="legend-row"><div class="legend-swatch" style="background:#93C5FD"></div>&lt; 200k</div>
        <div class="legend-row"><div class="legend-swatch" style="background:#60A5FA"></div>200k – 1M</div>
        <div class="legend-row"><div class="legend-swatch" style="background:#3B82F6"></div>1M – 3M</div>
        <div class="legend-row"><div class="legend-swatch" style="background:#1E3A8A"></div>3M+</div>
      </div>
      <div class="map-hint">Clique em um estado no mapa para explorar empresas ativas</div>

      <div class="side-panel" id="side-panel">
        <button class="close-panel" onclick="fecharPainel()">✕</button>
        <div class="side-header">
          <h2 id="side-title">—</h2>
        </div>
        <div class="side-body">
          <input class="side-search" id="side-search" placeholder="🔍 Buscar...">
          <div class="side-list" id="side-list"></div>
        </div>
      </div>
    </div>

    <div class="view" id="view-state-map">
      <button class="back-btn" onclick="voltarAoBrasil()">← Voltar</button>
      <div id="map-estado"></div>
    </div>

    <div class="view" id="view-table">
      <div class="table-view">
        <table>
          <thead>
            <tr>
              <th>CNPJ</th><th>Razão Social</th><th>Telefone</th><th>E-mail</th><th>Endereço</th>
            </tr>
          </thead>
          <tbody id="tabela-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const ESTADOS = {
  'AC': {name: 'Acre', coords: [-8.76, -70.55]},
  'AL': {name: 'Alagoas', coords: [-9.52, -36.52]},
  'AP': {name: 'Amapá', coords: [1.41, -52.17]},
  'AM': {name: 'Amazonas', coords: [-3.47, -65.10]},
  'BA': {name: 'Bahia', coords: [-14.24, -46.87]},
  'CE': {name: 'Ceará', coords: [-5.51, -39.32]},
  'DF': {name: 'Distrito Federal', coords: [-15.79, -47.88]},
  'ES': {name: 'Espírito Santo', coords: [-19.19, -40.34]},
  'GO': {name: 'Goiás', coords: [-15.89, -49.50]},
  'MA': {name: 'Maranhão', coords: [-2.89, -45.39]},
  'MT': {name: 'Mato Grosso', coords: [-12.64, -55.50]},
  'MS': {name: 'Mato Grosso do Sul', coords: [-20.51, -54.80]},
  'MG': {name: 'Minas Gerais', coords: [-18.51, -44.55]},
  'PA': {name: 'Pará', coords: [-5.33, -51.25]},
  'PB': {name: 'Paraíba', coords: [-7.06, -35.86]},
  'PR': {name: 'Paraná', coords: [-24.31, -51.51]},
  'PE': {name: 'Pernambuco', coords: [-8.28, -35.07]},
  'PI': {name: 'Piauí', coords: [-6.59, -42.75]},
  'RJ': {name: 'Rio de Janeiro', coords: [-22.84, -43.15]},
  'RN': {name: 'Rio Grande do Norte', coords: [-5.22, -36.52]},
  'RS': {name: 'Rio Grande do Sul', coords: [-27.59, -53.50]},
  'RO': {name: 'Rondônia', coords: [-8.76, -63.90]},
  'RR': {name: 'Roraima', coords: [2.07, -60.67]},
  'SC': {name: 'Santa Catarina', coords: [-27.04, -50.50]},
  'SP': {name: 'São Paulo', coords: [-22.25, -49.01]},
  'SE': {name: 'Sergipe', coords: [-10.38, -37.07]},
  'TO': {name: 'Tocantins', coords: [-9.50, -48.30]}
};

let estadoSelecionado = null;
let codigoMunicipio = null;
let cidadeSelecionada = null;
let cnaeSelecionado = null;
let mapaEstado = null;
let empresas = [];

function mostrarView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function resetar() {
  estadoSelecionado = null;
  codigoMunicipio = null;
  cidadeSelecionada = null;
  cnaeSelecionado = null;
  mostrarView('view-map');
  fecharPainel();
  if(mapaEstado) mapaEstado.remove();
  document.getElementById('toolbar').classList.remove('active');
}

async function selectEstado(uf) {
  estadoSelecionado = uf;
  mostrarView('view-state-map');
  inicializarMapaEstado();
  await carregarCidades(uf);
}

function inicializarMapaEstado() {
  if(mapaEstado) mapaEstado.remove();
  const coords = ESTADOS[estadoSelecionado].coords;
  mapaEstado = L.map('map-estado').setView(coords, 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(mapaEstado);
}

async function carregarCidades(uf) {
  try {
    const res = await fetch(`/api/empresas/cidades?estado=${uf}`);
    const cidades = await res.json();

    abrirPainel();
    document.getElementById('side-title').textContent = ESTADOS[uf].name;

    const lista = document.getElementById('side-list');
    lista.innerHTML = '';

    cidades.forEach(cidade => {
      const item = document.createElement('div');
      item.className = 'side-item';
      item.innerHTML = `<div class="t">${cidade.municipio}</div>`;
      item.onclick = () => selectCidade(cidade.municipio, cidade.codigo);
      lista.appendChild(item);
    });
  } catch(e) {
    console.error('Erro carregando cidades:', e);
    alert('Erro ao carregar cidades');
  }
}

async function selectCidade(municipio, codigo) {
  cidadeSelecionada = municipio;
  codigoMunicipio = codigo;
  fecharPainel();
  await carregarCNAEs();
}

async function carregarCNAEs() {
  try {
    const res = await fetch(`/api/empresas/cnaes?municipio=${codigoMunicipio}`);
    const cnaes = await res.json();

    const lista = document.getElementById('side-list');
    lista.innerHTML = '';
    document.getElementById('side-title').textContent = cidadeSelecionada;

    abrirPainel();

    cnaes.forEach(cnae => {
      const item = document.createElement('div');
      item.className = 'side-item';
      item.innerHTML = `<div class="t">${cnae.cnae} - ${cnae.descricao}</div>`;
      item.onclick = () => selectCNAE(cnae.cnae);
      lista.appendChild(item);
    });
  } catch(e) {
    console.error('Erro carregando CNAEs:', e);
  }
}

async function selectCNAE(cnae) {
  cnaeSelecionado = cnae;
  fecharPainel();
  document.getElementById('toolbar').classList.add('active');
  await carregarEmpresas();
  mostrarView('view-table');
}

async function carregarEmpresas() {
  try {
    const res = await fetch(`/api/empresas?municipio=${codigoMunicipio}&cnae=${cnaeSelecionado}`);
    const data = await res.json();
    empresas = data.empresas || [];

    const tbody = document.getElementById('tabela-body');
    tbody.innerHTML = '';

    empresas.forEach(emp => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="cnpj">${emp.cnpj || '—'}</td>
        <td class="razao">${emp.razao || '—'}</td>
        <td>${emp.tel1 || '—'}</td>
        <td class="email">${emp.email || '—'}</td>
        <td>${emp.logr || '—'}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch(e) {
    console.error('Erro carregando empresas:', e);
  }
}

function abrirPainel() {
  document.getElementById('side-panel').classList.add('open');
}

function fecharPainel() {
  document.getElementById('side-panel').classList.remove('open');
}

function voltarAoBrasil() {
  estadoSelecionado = null;
  if(mapaEstado) mapaEstado.remove();
  mostrarView('view-map');
}

function voltarParaCNAEs() {
  mostrarView('view-state-map');
  abrirPainel();
}

function exportarCSV() {
  const csv = [['CNPJ', 'Razão Social', 'Telefone', 'E-mail', 'Endereço']];
  empresas.forEach(emp => {
    csv.push([emp.cnpj || '', emp.razao || '', emp.tel1 || '', emp.email || '', emp.logr || '']);
  });

  const ws = XLSX.utils.aoa_to_sheet(csv);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Empresas");
  XLSX.writeFile(wb, `empresas_${estadoSelecionado}_${cidadeSelecionada}.xlsx`);
}

function inicializarMapa() {
  const map = L.map('map', {
    center: [-15.47, -51.93],
    zoom: 4,
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  Object.entries(ESTADOS).forEach(([uf, data]) => {
    const marker = L.circleMarker(data.coords, {
      radius: 12,
      fillColor: '#60a5fa',
      color: '#fff',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.85
    });

    marker.addTo(map);
    marker.bindPopup(`<strong>${data.name}</strong><br>(Clique para explorar)`);
    marker.on('click', function() {
      selectEstado(uf);
    });
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', inicializarMapa);
} else {
  inicializarMapa();
}
</script>
</body>
</html>
